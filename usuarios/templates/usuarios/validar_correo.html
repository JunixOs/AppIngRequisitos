<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validar correo | FinGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        .scrollbar-custom::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background-color: #a3e635;
            border-radius: 4px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background-color: #f3f4f6;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-white to-indigo-100 min-h-screen flex items-center justify-center relative overflow-hidden font-sans">

<!-- Fondos decorativos -->
<div class="absolute inset-0 pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-400 opacity-20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-0 right-0 w-80 h-80 bg-indigo-400 opacity-20 rounded-full blur-2xl animate-pulse delay-200"></div>
</div>

<!-- Modal de verificación -->
<div id="quick-access-modal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md relative animate__animated animate__fadeInDown animate__faster">
        <button onclick="window.location.href='/'" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-2xl transition duration-200 ease-in-out">&times;</button>

        <div class="text-center mb-6">
            <div class="text-green-600 text-4xl mb-2 animate__animated animate__bounceIn">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h2 class="text-2xl font-bold text-green-700 mb-1">Verificación de correo</h2>
            <p class="text-gray-500 text-sm">Ingrese el código de 6 dígitos enviado a su correo</p>
        </div>

        <form method="post" enctype="multipart/form-data" action="{% url 'usuarios:verificacion_correo' %}" class="space-y-6">
            {% csrf_token %}
            {% if error_message %}
            <div class="bg-red-100 text-red-700 px-4 py-2 rounded text-center text-sm font-medium shadow">
                <i class="fas fa-exclamation-circle mr-2"></i>{{ error_message }}
            </div>
            {% endif %}

            <!-- Inputs del código -->
            <div class="flex justify-center gap-3">
                {% for i in "012345" %}
                    <input type="number" name="pin{{ i }}" inputmode="numeric" maxlength="1"
                           class="w-12 h-12 text-center text-xl border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400 transition-all duration-150 shadow-sm hover:shadow-md"
                           oninput="moveFocus(this, 1)" {% if forloop.first %}autofocus{% endif %}/>
                {% endfor %}
            </div>

            <!-- Botón -->
            <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-yellow-400 text-white font-bold py-3 rounded-lg shadow-lg hover:scale-105 hover:shadow-xl transition-transform duration-200">
                <i class="fas fa-arrow-right mr-2"></i> Validar código
            </button>

            <!-- Link de reenviar -->
            <div class="text-sm text-center text-gray-400 mt-4">
                ¿No recibiste el código? <a href="{% url 'usuarios:verificacion_correo' %}">Reenviar</a>
            </div>
        </form>
    </div>
</div>

<!-- Script para navegación automática -->
<script>
    function moveFocus(input, direction) {
        const inputs = Array.from(input.parentElement.querySelectorAll('input'));
        const index = inputs.indexOf(input);
        if (input.value.length === 1 && direction === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        } else if (direction === 0 && input.value.length === 1) {
            input.blur();
        }
    }
</script>
</body>
</html>
